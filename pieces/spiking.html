<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spiking Net 発火 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="A spiking neural network firing in 3D — Izhikevich neurons wired by sparse synapses, cascades of neon spikes rippling through a ball, sheet, or cortical columns." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">igniting neurons</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Spiking <em>Net</em></div>
      <div class="s">発火 · v' = 0.04v² + 5v + 140 − u + I</div>
    </div>
  </div>

  <div class="panel">
    <h3>発火 · izhikevich neurons</h3>
    <div class="field">
      <label>topology <span class="muted" style="letter-spacing:0">↑↓</span></label>
      <div class="preset-row" id="topos"></div>
    </div>
    <div class="field">
      <label for="drive">input drive <span class="val" data-val="drive"></span></label>
      <input type="range" id="drive" min="0" max="12" step="0.1" value="5" />
    </div>
    <div class="field">
      <label for="density">connection density <span class="val" data-val="density"></span></label>
      <input type="range" id="density" min="0.002" max="0.04" step="0.001" value="0.012" />
    </div>
    <div class="field btnrow">
      <button class="btn" id="reset">reset</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="nb">700</b> neurons</div>
    <div><b id="fire">0</b> firing</div>
    <div>↑↓ topology</div>
  </div>

  <div class="hint">drag <b>orbit</b> · ↑↓ <b>topology</b> · raise <b>drive</b> for avalanches · press <b>R</b> to record</div>

  <script>window.__err=null;addEventListener("error",e=>{window.__err=String((e&&e.message)||e.error||e)})</script>
  <script type="module" src="../src/spiking.js"></script>
</body>
</html>
