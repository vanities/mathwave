<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diffusion 拡散 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="How image generators work — the DDPM diffusion process in 3D: pure noise denoised step by step into a shape, and back. Ho et al. 2020." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">denoising</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Diffusion <em>拡散</em></div>
      <div class="s">22 · noise → image (DDPM)</div>
    </div>
  </div>

  <div class="panel">
    <h3>拡散 · xₜ = √ᾱ x₀ + √(1−ᾱ)ε</h3>
    <div class="field">
      <label>target shape <span class="muted" style="letter-spacing:0">↑↓</span></label>
      <div class="preset-row" id="shapes"></div>
    </div>
    <div class="field">
      <label for="scrub">timestep (noise → image)</label>
      <input type="range" id="scrub" min="0" max="1" step="0.005" value="0" />
    </div>
    <div class="field">
      <label for="speed">speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="3" step="0.05" value="1" />
    </div>
    <div class="field btnrow">
      <button class="btn active" id="auto">auto-cycle</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b>9,000</b> points</div>
    <div><b id="stage">denoising</b></div>
  </div>

  <div class="hint">↑↓ <b>shape</b> · drag the <b>timestep</b> to scrub noise↔image · press <b>R</b> to record</div>
  <script type="module" src="../src/diffusion.js"></script>
</body>
</html>
