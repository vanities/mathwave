<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Apollonian Gasket — Field Notes</title>
  <meta name="description" content="The Apollonian gasket — recursive circle packing by the Descartes Circle Theorem, drawn entirely on the GPU via repeated circle inversions. Zoom into infinite nesting." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script>window.__err=null;addEventListener("error",e=>{window.__err=String((e&&e.message)||e.error||e)})</script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="veil">packing circles</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="fractal.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">The <em>Apollonian</em></div>
      <div class="s">49 · 円充 recursive circle packing</div>
    </div>
  </div>

  <div class="panel">
    <h3>k₄ = k₁+k₂+k₃ ± 2√(k₁k₂+k₂k₃+k₃k₁)</h3>

    <div class="field">
      <label for="depth">recursion depth <span class="val" data-val="depth"></span></label>
      <input type="range" id="depth" min="3" max="28" step="1" value="14" />
    </div>

    <div class="field btnrow">
      <button class="btn active" id="dive">auto-dive</button>
      <button class="btn" id="drift">drift</button>
      <button class="btn" id="reset">reset view</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div>depth <b id="dp">14</b></div>
    <div>zoom <b id="zm">1.00</b></div>
  </div>

  <div class="hint">drag <b>pan</b> · scroll <b>zoom</b> · ↑↓ <b>seed</b> · try <b>auto-dive</b></div>

  <script type="module" src="../src/apollonian.js?v=1"></script>
</body>
</html>
