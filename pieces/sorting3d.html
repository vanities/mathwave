<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Sorting 立体整列 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Sorting a 3D array — a cube of voxels laid along a Morton space-filling curve, shuffled then sorted into a smooth 3D color gradient." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">shuffling the cube</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">3D <em>Sorting</em></div>
      <div class="s">11 · 立体整列 space-filling curve</div>
    </div>
  </div>

  <div class="panel">
    <h3>立体整列 · 16³</h3>
    <div class="field">
      <label>algorithm <span class="muted" style="letter-spacing:0">↑↓</span></label>
      <div class="preset-row" id="algos"></div>
    </div>
    <div class="field">
      <label for="speed">ops / frame <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="20" max="1200" step="20" value="220" />
    </div>
    <div class="field btnrow">
      <button class="btn" id="shuffle">shuffle</button>
    </div>
    <div class="field">
      <p class="muted" style="font-size:0.86rem; line-height:1.5; margin:0.2rem 0 0; letter-spacing:0">
        Voxels are fixed on a Morton curve; <b>color = value</b>. A finished sort is a smooth gradient flowing through the cube.
      </p>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b>4,096</b> cells</div>
    <div><b id="done">sorting…</b></div>
  </div>

  <div class="hint">drag <b>orbit</b> · ↑↓ <b>algorithm</b> · watch chaos become a gradient · <b>R</b> to record</div>

  <script type="module" src="../src/sorting3d.js"></script>
</body>
</html>
