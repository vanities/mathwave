<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lattice Fluid 流体 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Lattice-Boltzmann D2Q9 on the GPU — a von Kármán vortex street peeling off a cylinder, coloured by vorticity." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body class="piece">
  <div class="veil">flooding the channel</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Lattice <em>Fluid</em></div>
      <div class="s">流体 lattice-boltzmann D2Q9</div>
    </div>
  </div>

  <div class="panel">
    <h3>流体 · von Kármán street</h3>
    <div class="field">
      <label>regime <span class="muted" style="letter-spacing:0">↑↓</span></label>
      <div class="preset-row" id="presets"></div>
    </div>
    <div class="field">
      <label for="inlet">inlet speed <span class="val" data-val="inlet"></span></label>
      <input type="range" id="inlet" min="0.02" max="0.16" step="0.002" value="0.100" />
    </div>
    <div class="field">
      <label for="tau">viscosity (τ) <span class="val" data-val="tau"></span></label>
      <input type="range" id="tau" min="0.52" max="0.90" step="0.005" value="0.580" />
    </div>
    <div class="field btnrow">
      <button class="btn" id="reset">reset</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="presetname">Re·mid circle</b></div>
    <div>↑↓ regime</div>
  </div>

  <div class="hint">↑↓ <b>regime</b> · <b>space</b> toggles vorticity·speed · <b>reset</b> the flow · <b>R</b> to record</div>

  <script>window.__err=null;addEventListener("error",e=>{window.__err=String((e&&e.message)||e.error||e)})</script>
  <script type="module" src="../src/lbm.js"></script>
</body>
</html>
