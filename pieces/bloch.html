<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bloch Sphere 量子 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="A qubit on the Bloch sphere — superposition and phase as a point on a sphere; quantum gates (X/Y/Z/H/S/T) as rotations." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">preparing qubit</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Bloch <em>Sphere</em></div>
      <div class="s">27 · 量子 a qubit's state</div>
    </div>
  </div>

  <div class="panel">
    <h3>量子 · |ψ⟩=cos θ⁄2|0⟩+e^{iφ}sin θ⁄2|1⟩</h3>
    <div class="field">
      <label>gates <span class="muted" style="letter-spacing:0">↑↓ tour</span></label>
      <div class="preset-row" id="gates"></div>
    </div>
    <div class="field btnrow">
      <button class="btn" id="reset">reset to |0⟩</button>
    </div>
    <div class="field">
      <p class="muted" style="font-size:0.84rem; line-height:1.5; margin:0.2rem 0 0; letter-spacing:0">
        <span style="color:#ff2e97">|0⟩</span> north, <span style="color:#2be4ff">|1⟩</span> south, equator = superposition. Gates are <b>rotations</b>; H makes a superposition, T adds phase.
      </p>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div>last gate: <b id="gate">—</b></div>
    <div><b id="qstate">1.00|0⟩</b></div>
  </div>

  <div class="hint">drag <b>orbit</b> · click <b>gates</b> · ↑↓ runs a gate tour · press <b>R</b> to record</div>
  <script type="module" src="../src/bloch.js"></script>
</body>
</html>
