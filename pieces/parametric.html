<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graphed Surfaces — Field Notes</title>
  <meta name="description" content="A height-field playground: type z = f(x, y, t) and watch it become a living 3D surface." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">drawing the surface</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="../index.html"><span aria-hidden="true">←</span> Gallery</a>
    <div class="hud-title">
      <div class="t">Graphed <em>Surfaces</em></div>
      <div class="s">01 · 曲面 height field</div>
    </div>
  </div>

  <div class="panel">
    <h3>z = f(x, y, t)</h3>

    <div class="field">
      <label for="eqn">equation <span class="muted" style="letter-spacing:0">use x, y, t</span></label>
      <input type="text" id="eqn" spellcheck="false" autocomplete="off"
             value="sin(hypot(x,y)*3 - t*2) / (1 + hypot(x,y)*0.5)" />
    </div>

    <div class="field">
      <label>presets</label>
      <div class="preset-row" id="presets"></div>
    </div>

    <div class="field">
      <label for="res">resolution <span class="val" data-val="res"></span></label>
      <input type="range" id="res" min="32" max="200" step="4" value="120" />
    </div>

    <div class="field">
      <label for="domain">domain ±<span class="val" data-val="domain"></span></label>
      <input type="range" id="domain" min="3" max="14" step="0.5" value="6.5" />
    </div>

    <div class="field">
      <label for="speed">time speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="3" step="0.05" value="1" />
    </div>

    <div class="field btnrow">
      <button class="btn active" id="wire">wireframe</button>
      <button class="btn" id="spin">auto-spin</button>
      <button class="btn" id="reset">reset view</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="verts">–</b> verts</div>
    <div id="status">ok</div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · edit the <b>equation</b></div>

  <!-- math expression engine (exposes window.math) -->
  <script src="https://unpkg.com/mathjs@12.4.1/lib/browser/math.js"></script>
  <script type="module" src="../src/parametric.js"></script>
</body>
</html>
