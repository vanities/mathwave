<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strange Attractors — Field Notes</title>
  <meta name="description" content="Lorenz, Aizawa, Thomas — chaotic differential equations drawn as glowing ribbons that trace the geometry of chaos." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">integrating chaos</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="../index.html"><span aria-hidden="true">←</span> Gallery</a>
    <div class="hud-title">
      <div class="t">Strange <em>Attractors</em></div>
      <div class="s">03 · 混沌 chaotic ODEs</div>
    </div>
  </div>

  <div class="panel">
    <h3>ẋ = f(x)</h3>

    <div class="field">
      <label>system</label>
      <div class="preset-row" id="systems"></div>
    </div>

    <div class="field">
      <label for="speed">draw / spin speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="3" step="0.05" value="1" />
    </div>

    <div class="field btnrow">
      <button class="btn active" id="spin">auto-spin</button>
      <button class="btn" id="replay">replay</button>
      <button class="btn" id="reset">reset view</button>
    </div>

    <div class="field">
      <label style="margin-bottom:0">about</label>
      <p class="muted" id="about" style="font-size:0.72rem; line-height:1.5; margin:0.3rem 0 0; letter-spacing:0">—</p>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="pts">–</b> pts</div>
    <div id="name">lorenz</div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · switch the <b>system</b></div>

  <script type="module" src="../src/attractor.js"></script>
</body>
</html>
