<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sphere Eversion 反転 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Turning a sphere inside-out — an artistic Morin-style eversion. Front and back faces are colored differently so you watch the inside become the outside." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">turning inside-out</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Sphere <em>Eversion</em></div>
      <div class="s">12 · 反転 inside ⇄ outside</div>
    </div>
  </div>

  <div class="panel">
    <h3>反転 · 球面</h3>

    <div class="field">
      <label>corrugations</label>
      <div class="preset-row" id="lobes"></div>
    </div>

    <div class="field">
      <label for="speed">morph speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="0.6" step="0.01" value="0.18" />
    </div>

    <div class="field btnrow">
      <button class="btn active" id="play">pause</button>
      <button class="btn" id="reset">reset view</button>
    </div>

    <div class="field">
      <p class="muted" style="font-size:0.92rem; line-height:1.45; margin:0.2rem 0 0; letter-spacing:0">
        <span style="color:var(--accent)">■</span> outside &nbsp; <span style="color:var(--accent-2)">■</span> inside.
        An artistic Morin-style morph — not a certified regular homotopy.
      </p>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div>τ <b id="tau">0.00</b></div>
    <div><b id="state">sphere</b></div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · watch <b>inside ⇄ outside</b> · press <b>R</b> to record</div>

  <script type="module" src="../src/eversion.js"></script>
</body>
</html>
