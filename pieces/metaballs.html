<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metaballs 雫 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Raymarched metaballs — organic lava-lamp blobs that merge and split, built from the smooth-union of sphere distance fields." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
  </script>
  <script>window.__err=null;addEventListener("error",e=>{window.__err=String((e&&e.message)||e.error||e)})</script>
</head>
<body class="piece">
  <div class="veil">growing blobs</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t"><em>Metaballs</em></div>
      <div class="s">45 · 雫 smooth-union SDF</div>
    </div>
  </div>

  <div class="panel">
    <h3>雫 · smin(a,b,k) = mix(b,a,h) − k·h·(1−h)</h3>

    <div class="field">
      <label for="blend">blend k <span class="val" data-val="blend"></span></label>
      <input type="range" id="blend" min="0.05" max="1.4" step="0.01" value="0.55" />
    </div>

    <div class="field">
      <label for="speed">drift speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="2.5" step="0.05" value="1" />
    </div>

    <div class="field">
      <label>ball count <span class="muted" style="letter-spacing:0">↑↓</span> <b id="count">6</b></label>
    </div>

    <div class="field btnrow">
      <button class="btn active" id="spin">auto-spin</button>
      <button class="btn" id="reset">reset view</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div>k <b id="kval">0.55</b></div>
    <div>dist <b id="dist">4.60</b></div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · ↑↓ <b>ball count</b> · raise <b>blend k</b> to fuse · press <b>R</b> to record</div>

  <script type="module" src="../src/metaballs.js"></script>
</body>
</html>
