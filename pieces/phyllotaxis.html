<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phyllotaxis 黄金 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Phyllotaxis — Vogel's sunflower model. Seeds at the golden angle 137.5° pack with no gaps; nudge it and the spiral collapses." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">growing seeds</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Phyllotaxis <em>黄金</em></div>
      <div class="s">35 · the golden angle 137.5°</div>
    </div>
  </div>

  <div class="panel">
    <h3>黄金 · θ=n·137.5° r=c√n</h3>
    <div class="field">
      <label>angle <span class="muted" style="letter-spacing:0">↑↓</span></label>
      <div class="preset-row" id="angles"></div>
    </div>
    <div class="field">
      <label for="fine">fine angle <span class="val" data-val="fine"></span></label>
      <input type="range" id="fine" min="135" max="140" step="0.01" value="137.51" />
    </div>
    <div class="field">
      <label for="count">seeds <span class="val" data-val="count"></span></label>
      <input type="range" id="count" min="200" max="4000" step="100" value="1600" />
    </div>
    <div class="field">
      <label for="dome">dome <span class="val" data-val="dome"></span></label>
      <input type="range" id="dome" min="0" max="1.5" step="0.05" value="0.5" />
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="angname">137.5° golden</b></div>
    <div>↑↓ angle</div>
  </div>

  <div class="hint">drag <b>orbit</b> · nudge the <b>fine angle</b> off 137.5° and watch it collapse · press <b>R</b></div>
  <script type="module" src="../src/phyllotaxis.js"></script>
</body>
</html>
