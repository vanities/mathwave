<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Mandelbox — Field Notes</title>
  <meta name="description" content="The Mandelbox fractal — box-fold and sphere-fold distance estimator, raymarched entirely on the GPU. Orbit and zoom the infinite cubic lattice." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="veil">folding space</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">The <em>Mandelbox</em></div>
      <div class="s">41 · 箱 fold-and-scale SDF</div>
    </div>
  </div>

  <div class="panel">
    <h3>v → s·fold(v) + p</h3>

    <div class="field">
      <label for="scale">fold scale <span class="val" data-val="scale"></span></label>
      <input type="range" id="scale" min="-3" max="3" step="0.05" value="-1.7" />
    </div>

    <div class="field">
      <label for="iter">fractal iterations <span class="val" data-val="iter"></span></label>
      <input type="range" id="iter" min="2" max="18" step="1" value="12" />
    </div>

    <div class="field">
      <label for="steps">march detail <span class="val" data-val="steps"></span></label>
      <input type="range" id="steps" min="40" max="200" step="5" value="120" />
    </div>

    <div class="field btnrow">
      <button class="btn" id="morph">morph scale</button>
      <button class="btn active" id="spin">auto-spin</button>
      <button class="btn" id="reset">reset view</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div>scale <b id="sc">-1.70</b></div>
    <div>dist <b id="dist">7.0</b></div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · try <b>morph scale</b></div>

  <script>window.__err=null;addEventListener("error",e=>{window.__err=String((e&&e.message)||e.error||e)})</script>
  <script type="module" src="../src/mandelbox.js?v=fix2"></script>
</body>
</html>
