<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>N-Body Gravity 重力 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Newtonian N-body gravity with velocity-Verlet integration — disks, collisions, cold collapse. Bodies leave neon trails colored by speed." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">igniting gravity</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">N-Body <em>Gravity</em></div>
      <div class="s">17 · 重力 F = Gm₁m₂/r²</div>
    </div>
  </div>

  <div class="panel">
    <h3>重力 · velocity-verlet</h3>
    <div class="field">
      <label>system <span class="muted" style="letter-spacing:0">↑↓</span></label>
      <div class="preset-row" id="systems"></div>
    </div>
    <div class="field">
      <label for="speed">time speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="3" step="0.05" value="1" />
    </div>
    <div class="field">
      <label for="bodies">bodies <span class="val" data-val="bodies"></span></label>
      <input type="range" id="bodies" min="10" max="160" step="10" value="80" />
    </div>
    <div class="field btnrow">
      <button class="btn" id="reseed">reseed</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="nb">80</b> bodies</div>
    <div>↑↓ system</div>
  </div>

  <div class="hint">drag <b>orbit</b> · ↑↓ <b>system</b> · try <b>collision</b> · press <b>R</b> to record</div>

  <script type="module" src="../src/nbody.js"></script>
</body>
</html>
