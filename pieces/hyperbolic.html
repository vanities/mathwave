<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hyperbolic Tiling — Field Notes</title>
  <meta name="description" content="A {p,q} regular tiling of the hyperbolic plane in the Poincaré disk, folded into its fundamental domain on the GPU. Glide through non-Euclidean space." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
    }
  }
  </script>

  <script>window.__err=null;addEventListener("error",e=>{window.__err=String((e&&e.message)||e.error||e)})</script>
</head>
<body class="piece">
  <div class="veil">folding the hyperbolic plane</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="mandelbrot.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t"><em>双曲</em> Hyperbolic</div>
      <div class="s">{p,q} · 双曲 Poincaré disk</div>
    </div>
  </div>

  <div class="panel">
    <h3>{p,q} Poincaré tiling</h3>

    <div class="field">
      <label for="p">p — polygon sides <span class="val" data-val="p"></span></label>
      <input type="range" id="p" min="3" max="12" step="1" value="7" />
    </div>

    <div class="field">
      <label for="q">q — polygons per vertex <span class="val" data-val="q"></span></label>
      <input type="range" id="q" min="3" max="12" step="1" value="3" />
    </div>

    <div class="field">
      <label for="speed">glide speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="0.8" step="0.01" value="0.18" />
    </div>

    <div class="field btnrow">
      <button class="btn" id="reset">reset glide</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div>{<b id="pv">7</b>,<b id="qv">3</b>}</div>
  </div>

  <div class="hint">↑/↓ <b>presets</b> · drag sliders for <b>{p,q}</b> · <b>reset</b> to recentre</div>

  <script type="module" src="../src/hyperbolic.js?v=fix2"></script>
</body>
</html>
