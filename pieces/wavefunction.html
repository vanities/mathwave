<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavefunction 波動 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="The 2D Schrödinger equation — a Gaussian wavepacket evolving through double slits, tunnelling barriers, and a harmonic well." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
  </script>
  <script>window.__err=null;addEventListener("error",e=>{window.__err=String((e&&e.message)||e.error||e)})</script>
</head>
<body class="piece">
  <div class="veil">collapsing the packet</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="metaballs.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Wave<em>function</em></div>
      <div class="s">45 · 波動 schrödinger</div>
    </div>
  </div>

  <div class="panel">
    <h3>波動 · i∂ψ/∂t = (−½∇²+V)ψ</h3>
    <div class="field">
      <label>potential <span class="muted" style="letter-spacing:0">↑↓</span></label>
      <div class="preset-row" id="presets"></div>
    </div>
    <div class="field">
      <label for="momentum">momentum <span class="val" data-val="momentum"></span></label>
      <input type="range" id="momentum" min="0" max="14" step="0.5" value="7" />
    </div>
    <div class="field">
      <label for="barrier">barrier <span class="val" data-val="barrier"></span></label>
      <input type="range" id="barrier" min="2" max="24" step="1" value="12" />
    </div>
    <div class="field">
      <label for="rate">sim speed <span class="val" data-val="rate"></span></label>
      <input type="range" id="rate" min="1" max="16" step="1" value="8" />
    </div>
    <div class="field btnrow">
      <button class="btn active" id="play">pause</button>
      <button class="btn" id="reemit">re-emit</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="presetname">free packet</b></div>
    <div>↑↓ potential</div>
  </div>

  <div class="hint">↑↓ <b>potential</b> · <b>re-emit</b> the packet · press <b>R</b> to record</div>

  <script type="module" src="../src/wavefunction.js?v=fix3"></script>
</body>
</html>
