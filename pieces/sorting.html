<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sorting 整列 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Sorting algorithms as a 3D neon bar landscape — bubble, quick, heap and more, comparisons flashing, looping forever." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">shuffling</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Sorting <em>整列</em></div>
      <div class="s">10 · algorithm landscape</div>
    </div>
  </div>

  <div class="panel">
    <h3>整列 · O(n log n)?</h3>

    <div class="field">
      <label>algorithm</label>
      <div class="preset-row" id="algos"></div>
    </div>

    <div class="field">
      <label for="speed">steps / sec <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="5" max="600" step="5" value="90" />
    </div>

    <div class="field">
      <label for="size">array size <span class="val" data-val="size"></span></label>
      <input type="range" id="size" min="20" max="160" step="2" value="80" />
    </div>

    <div class="field btnrow">
      <button class="btn active" id="cycle">auto-cycle</button>
      <button class="btn" id="shuffle">shuffle</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="ops">0</b> ops</div>
    <div><b id="algoname">bubble</b></div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · watch it <b>auto-cycle</b> · press <b>R</b> to record</div>

  <script type="module" src="../src/sorting.js"></script>
</body>
</html>
