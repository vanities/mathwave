<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Sort 故障 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="A generative neon field torn apart and re-ordered pixel by pixel — the glitch technique Kim Asendorf made famous." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <!-- common.js imports three, so the map is required even though this room is Canvas2D -->
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body class="piece">
  <div class="veil">sorting pixels</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Pixel <em>Sort</em></div>
      <div class="s">04 · 故障 after kim asendorf</div>
    </div>
  </div>

  <div class="panel">
    <h3>ＡＳＤＦ ／ 整列</h3>

    <div class="field">
      <label for="thr">threshold <span class="val" data-val="thr"></span></label>
      <input type="range" id="thr" min="0.05" max="0.95" step="0.01" value="0.5" />
    </div>

    <div class="field">
      <label>direction</label>
      <div class="preset-row" id="dirs"></div>
    </div>

    <div class="field">
      <label>sort by</label>
      <div class="preset-row" id="keys"></div>
    </div>

    <div class="field btnrow">
      <button class="btn active" id="animate">animate</button>
      <button class="btn" id="regen">regenerate</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="res">–</b> px</div>
    <div>thr <b id="thrval">0.50</b></div>
  </div>

  <div class="hint">drag <b>threshold</b> · change <b>direction</b> · <b>regenerate</b> the field</div>

  <script type="module" src="../src/pixelsort.js"></script>
</body>
</html>
