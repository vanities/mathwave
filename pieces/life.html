<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Game of Life 立体生命 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="A true 3D cellular automaton — Carter Bays' 26-neighbor rules (5766, 4555, pyroclastic…) rendered as hollow neon voxel shells." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">seeding 3d life</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="../index.html"><span aria-hidden="true">←</span> Gallery</a>
    <div class="hud-title">
      <div class="t">3D Game of <em>Life</em></div>
      <div class="s">04 · 立体 26-neighbor automaton</div>
    </div>
  </div>

  <div class="panel">
    <h3>立体生命 · bays rule</h3>

    <div class="field">
      <label>rule <span class="muted" style="letter-spacing:0">survive / born</span></label>
      <div class="preset-row" id="patterns"></div>
    </div>

    <div class="field">
      <label for="speed">generations / sec <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="1" max="20" step="1" value="6" />
    </div>

    <div class="field btnrow">
      <button class="btn active" id="play">pause</button>
      <button class="btn" id="step">step</button>
      <button class="btn" id="clear">reseed</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div>gen <b id="gen">0</b></div>
    <div><b id="alive">–</b> alive</div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · try rule <b>5766</b> for gliders · <b>R</b> to record</div>

  <script type="module" src="../src/life.js"></script>
</body>
</html>
