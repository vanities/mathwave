<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Quaternion Julia — Field Notes</title>
  <meta name="description" content="A true 4D fractal — the quaternion Julia set z → z² + c — sliced into 3D and raymarched on the GPU. Sweep the 4th dimension." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="veil">compiling shader</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="mandelbox.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">The <em>Quaternion Julia</em></div>
      <div class="s">43 · 四元 4D fractal sliced into 3D</div>
    </div>
  </div>

  <div class="panel">
    <h3>z → z² + c &nbsp;∈ ℍ</h3>

    <div class="field">
      <label for="slice">4D slice <span class="val" data-val="slice"></span></label>
      <input type="range" id="slice" min="-1" max="1" step="0.01" value="0" />
    </div>

    <div class="field">
      <label for="cy">c · i <span class="val" data-val="cy"></span></label>
      <input type="range" id="cy" min="-1" max="1" step="0.01" value="-0.447" />
    </div>

    <div class="field">
      <label for="steps">march detail <span class="val" data-val="steps"></span></label>
      <input type="range" id="steps" min="40" max="160" step="5" value="110" />
    </div>

    <div class="field btnrow">
      <button class="btn active" id="morph">sweep 4D</button>
      <button class="btn active" id="spin">auto-spin</button>
      <button class="btn" id="reset">reset view</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div>slice <b id="slc">0.00</b></div>
    <div>dist <b id="dist">2.80</b></div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · <b>sweep 4D</b> · <b>↑↓</b> presets</div>

  <script>window.__err=null;addEventListener("error",e=>{window.__err=String((e&&e.message)||e.error||e)})</script>
  <script type="module" src="../src/qjulia.js?v=ps1"></script>
</body>
</html>
