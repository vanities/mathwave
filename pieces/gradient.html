<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gradient Descent 勾配 — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Three optimizers — SGD, Momentum, Adam — roll down a 3D neon loss landscape, leaving light trails. 3D calculus meets machine learning." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">descending</div>
  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">Gradient <em>Descent</em></div>
      <div class="s">06 · 勾配 minimize the loss</div>
    </div>
  </div>

  <div class="panel">
    <h3>勾配 · θ ← θ − η∇L</h3>
    <div class="field">
      <label>landscape <span class="muted" style="letter-spacing:0">↑↓</span></label>
      <div class="preset-row" id="landscapes"></div>
    </div>
    <div class="field">
      <label for="speed">step speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="3" step="0.05" value="1" />
    </div>
    <div class="field btnrow">
      <button class="btn" id="restart">restart</button>
      <button class="btn" id="reset">reset view</button>
    </div>
    <div class="field">
      <p class="muted" style="font-size:0.9rem; line-height:1.5; margin:0.2rem 0 0; letter-spacing:0">
        <span style="color:#2be4ff">■</span> SGD &nbsp; <span style="color:#ff2e97">■</span> momentum &nbsp; <span style="color:#62ffb3">■</span> Adam &nbsp; <span style="color:#b06bff">■</span> annealing
      </p>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b id="steps">0</b> steps</div>
    <div>↑↓ landscape</div>
  </div>

  <div class="hint">drag <b>orbit</b> · ↑↓ <b>landscape</b> · watch <b>annealing</b> escape local minima · press <b>R</b></div>

  <script type="module" src="../src/gradient.js"></script>
</body>
</html>
