<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Vector Field 流れ — ＭＡＴＨＷＡＶＥ</title>
  <meta name="description" content="Thousands of particles advected through a 3D vector field — ABC flow, vortex, the Lorenz flow — drawn as neon streaks. 3D calculus made visible." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Monoton&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/base.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="piece">
  <div class="paper" aria-hidden="true"></div>
  <div class="veil">seeding the flow</div>

  <canvas id="scene"></canvas>

  <div class="hud hud-top">
    <a class="hud-back" href="parametric.html"><span aria-hidden="true">←</span> 数学波</a>
    <div class="hud-title">
      <div class="t">3D Vector <em>Field</em></div>
      <div class="s">05 · 流れ particle advection</div>
    </div>
  </div>

  <div class="panel">
    <h3>流れ · V(x,y,z)</h3>

    <div class="field">
      <label>field</label>
      <div class="preset-row" id="fields"></div>
    </div>

    <div class="field">
      <label for="speed">flow speed <span class="val" data-val="speed"></span></label>
      <input type="range" id="speed" min="0" max="3" step="0.05" value="1" />
    </div>

    <div class="field btnrow">
      <button class="btn active" id="play">pause</button>
      <button class="btn" id="respawn">respawn</button>
      <button class="btn" id="reset">reset view</button>
    </div>
  </div>

  <div class="readout">
    <div><b id="fps">–</b> fps</div>
    <div><b>9,000</b> particles</div>
    <div>field <b id="fieldname">abc</b></div>
  </div>

  <div class="hint">drag <b>orbit</b> · scroll <b>zoom</b> · switch the <b>field</b> · press <b>R</b> to record</div>

  <script type="module" src="../src/vectorfield.js"></script>
</body>
</html>
